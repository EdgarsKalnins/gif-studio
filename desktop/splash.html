<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GIF Studio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #141416;
        border: 1px solid rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.04em;
        color: #f4f4f6;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .sub {
        font-size: 12px;
        color: #a1a1aa;
      }
      .bar {
        width: 180px;
        height: 2px;
        border-radius: 999px;
        background: #27272a;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: #f4f4f6;
        animation: slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes slide {
        from {
          transform: translateX(0%);
        }
        to {
          transform: translateX(122%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">GIF</div>
      <div class="title">Starting GIF Studio…</div>
      <div class="sub">Launching local Python + FFmpeg engine (100% offline)</div>
      <div class="bar"><span></span></div>
    </div>
  </body>
</html>
