[project]
name = "gif-maker-backend"
version = "0.1.0"
description = "FastAPI + Pillow + pillow-heif + FFmpeg GIF & animation rendering backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pillow>=11.0.0",
  "pillow-heif>=0.20.0",
  "numpy>=2.0.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
desktop = [
  "pyinstaller>=6.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
